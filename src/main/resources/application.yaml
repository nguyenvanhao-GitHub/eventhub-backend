spring:
  application:
    name: eventhub-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # File upload configuration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Jackson date/time formatting
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: UTC
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

# Custom application properties
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  jwt:
    signer-key: ${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    valid-duration: ${APP_JWT_EXPIRATION_SECONDS:86400} # 1 day in seconds
    refreshable-duration: ${APP_JWT_REFRESH_EXPIRATION_SECONDS:604800} # 7 days in seconds
  file:
    upload-dir: ${FILE_UPLOAD_DIR:./uploads}
